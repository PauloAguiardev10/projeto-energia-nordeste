<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Energia Nordeste</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#020617;
    color:white;
    text-align:center;
}

h1{
    margin-top:40px;
}

button{
    padding:15px;
    margin:20px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#38bdf8;
    color:#082f49;
}

button:hover{
    transform:scale(1.05);
}

pre{
    text-align:left;
    max-width:600px;
    margin:auto;
    background:#0f172a;
    padding:20px;
    border-radius:10px;
}

img{
    margin-top:20px;
    border-radius:10px;
    background:white;
    padding:5px;
}
</style>

</head>

<body>

<h1>⚡ Energia Renovável no Nordeste</h1>

<p>
Projeto de Big Data utilizando dados da ANEEL para análise
de energia solar e eólica.
</p>

<button onclick="carregar()">Carregar Análise</button>

<pre id="resposta"></pre>

<img id="grafico" width="600">

<script>

function carregar(){

fetch("/api/analise")
.then(r=>r.json())
.then(d=>{
    document.getElementById("resposta").innerText = d.resposta
    document.getElementById("grafico").src = d.grafico_url
})
}

</script>

</body>
</html>
